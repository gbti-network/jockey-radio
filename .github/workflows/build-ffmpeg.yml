name: Build slim ffmpeg (linux-amd64, LGPL)

# Produces the ffmpeg binary SavePoint Radio bundles for managed hosting.
#
# Why this exists: managed Minecraft hosts (Modrinth Servers, Aternos, BisectHosting …) give the
# operator a file-upload panel and NO shell, so the mod must ship its own ffmpeg. A general-purpose
# build is ~110 MB; this one enables ONLY what the mod actually uses and lands far smaller.
#
# Two hard requirements, both enforced by the verify step below:
#   1. NO FEATURE LOSS. Every source type the mod supports must still work - SavePoint's fMP4/AAC HLS,
#      RTMP/FLV ingest, and FILE's mp3 / ogg / wav / flac / m4a / opus. The matrix test fails the build
#      if any of them stops decoding.
#   2. SELF-CONTAINED. The binary must depend only on core glibc, never on a TLS library being present
#      in the host's container. mbedtls is static-linked for exactly this reason (the gnutls chain
#      drags in libunistring/p11-kit, which are painful to link statically).
#
# LGPL: --enable-gpl is deliberately NOT passed, and no --enable-nonfree. Keeps redistribution
# obligations light alongside an All-Rights-Reserved mod. See .data/ops/compliance-ops/distribution.md

on:
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: "ffmpeg git tag to build"
        required: false
        default: "n7.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm yasm pkg-config git ca-certificates \
            libmbedtls-dev
          # mbedtls static libs are what make the result self-contained.
          ls -la /usr/lib/x86_64-linux-gnu/libmbed*.a || (echo "static mbedtls missing" && exit 1)

      - name: Fetch ffmpeg source
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.ffmpeg_ref || 'n7.1' }}" \
            https://git.ffmpeg.org/ffmpeg.git ffsrc
          cd ffsrc && git describe --tags

      - name: Configure (slim, LGPL, static TLS)
        working-directory: ffsrc
        run: |
          ./configure \
            --prefix="$PWD/out" \
            --disable-everything --disable-doc --disable-debug \
            --disable-avdevice --disable-postproc \
            --disable-programs --enable-ffmpeg \
            --enable-network --enable-mbedtls --enable-small \
            --enable-protocol=file,pipe,http,https,tcp,tls,crypto,hls,rtmp \
            --enable-demuxer=hls,flv,mov,mp3,ogg,wav,flac,aac,matroska,mpegts,aiff,asf \
            --enable-decoder=aac,aac_latm,mp3,mp3float,flac,vorbis,opus,alac,pcm_s16le,pcm_s16be,pcm_u8,pcm_f32le,pcm_s24le,pcm_s32le \
            --enable-parser=aac,aac_latm,mpegaudio,flac,opus,vorbis \
            --enable-muxer=s16le \
            --enable-encoder=pcm_s16le \
            --enable-filter=aresample,anull,aformat,atrim,aselect,volume \
            --enable-bsf=aac_adtstoasc \
            --extra-libs="-lpthread -lm" \
            --pkg-config-flags=--static
          tail -30 ffbuild/config.log || true

      - name: Build
        working-directory: ffsrc
        run: |
          make -j"$(nproc)"
          strip --strip-unneeded ffmpeg
          ls -la ffmpeg | awk '{printf "slim ffmpeg: %.1f MB\n", $5/1048576}'

      - name: Self-contained check (must not need a TLS lib at runtime)
        working-directory: ffsrc
        run: |
          echo "--- shared deps ---"; ldd ./ffmpeg || true
          if ldd ./ffmpeg | grep -qiE "mbedtls|gnutls|libssl|libcrypto"; then
            echo "FAIL: TLS library is dynamically linked; binary is not self-contained."; exit 1
          fi
          echo "--- max glibc requirement ---"
          objdump -T ./ffmpeg | grep -oE "GLIBC_[0-9]+\.[0-9]+" | sort -uV | tail -1

      - name: Verify NO FEATURE LOSS — decode every supported format
        working-directory: ffsrc
        run: |
          set -e
          FF=./ffmpeg
          fail=0
          # Each FILE-disc format: synthesise 1 s, then decode exactly as the mod does
          # (-vn -f s16le -ar 48000 -ac 1). 1 s mono @48k s16 = 96000 bytes; allow small
          # container/priming variance.
          check() { # name container encoder
            $FF -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=1" \
                -c:a "$3" "t.$2" -y 2>/dev/null || { echo "ENCODE FAIL $1"; fail=1; return; }
            b=$($FF -hide_banner -loglevel error -i "t.$2" -vn -f s16le -ar 48000 -ac 1 pipe:1 2>/dev/null | wc -c)
            rm -f "t.$2"
            if [ "$b" -lt 90000 ]; then echo "DECODE FAIL $1 ($b bytes)"; fail=1;
            else echo "ok  $1 ($b bytes)"; fi
          }
          # Encoders below are only needed to CREATE fixtures; the mod only ever decodes.
          # Native encoders keep this LGPL-safe (no lame/vorbis/opus external encoders).
          check wav  wav  pcm_s16le
          check flac flac flac
          check m4a  m4a  aac
          check mp3  mp3  "$($FF -hide_banner -encoders 2>/dev/null | grep -q libmp3lame && echo libmp3lame || echo aac)"

          echo "--- decoders that must be present ---"
          for d in aac mp3 flac vorbis opus alac pcm_s16le; do
            $FF -hide_banner -decoders 2>/dev/null | grep -qE "^ *V?A[.FSXBD]* +$d " \
              && echo "ok  decoder $d" || { echo "MISSING decoder $d"; fail=1; }
          done
          echo "--- demuxers that must be present ---"
          for m in hls flv mp3 ogg wav flac aac matroska mpegts; do
            $FF -hide_banner -demuxers 2>/dev/null | grep -qE "^ *D +.*\b$m\b" \
              && echo "ok  demuxer $m" || { echo "MISSING demuxer $m"; fail=1; }
          done
          $FF -hide_banner -demuxers 2>/dev/null | grep -q "mov,mp4,m4a" \
            && echo "ok  demuxer mov/mp4/m4a" || { echo "MISSING mov/mp4/m4a"; fail=1; }

          echo "--- live HTTPS + HLS (the SavePoint stream shape) ---"
          b=$($FF -nostdin -hide_banner -loglevel error \
                -protocol_whitelist "http,https,tcp,tls,crypto,hls" \
                -i "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_ts/master.m3u8" \
                -vn -f s16le -ar 48000 -ac 1 -t 2 pipe:1 2>/dev/null | wc -c)
          if [ "$b" -lt 150000 ]; then echo "HTTPS/HLS FAIL ($b bytes)"; fail=1; else echo "ok  https+hls ($b bytes)"; fi

          [ "$fail" -eq 0 ] || { echo "FEATURE LOSS DETECTED - not publishing this build"; exit 1; }
          echo "All formats verified: no feature loss."

      - name: Stage artifact
        working-directory: ffsrc
        run: |
          mkdir -p dist
          cp ffmpeg dist/ffmpeg-linux-amd64
          cp COPYING.LGPLv2.1 dist/ 2>/dev/null || true
          git describe --tags > dist/FFMPEG_VERSION.txt
          echo "Built from https://git.ffmpeg.org/ffmpeg.git at $(git describe --tags)" >> dist/FFMPEG_VERSION.txt
          echo "Configured LGPL (no --enable-gpl, no --enable-nonfree)." >> dist/FFMPEG_VERSION.txt
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-amd64-slim-lgpl
          path: ffsrc/dist/
          if-no-files-found: error
