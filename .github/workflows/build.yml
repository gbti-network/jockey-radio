name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# No secrets are used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Builds the mod (compileJava + processResources + jar). There is no
      # gametest task wired up on this toolchain yet (see README "Testing"),
      # so `build` is the full CI gate. If a `runGametest` task is added in a
      # later phase, append it here.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jockey-radio-jar
          path: build/libs/*.jar
          if-no-files-found: error
