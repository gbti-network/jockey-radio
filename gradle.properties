# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / Fabric
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.155.2+26.2

# Mod
mod_version=0.1.1
# Monotonic build counter, bumped by `npm run release` (scripts/release.mjs). Never reset on a
# version bump, so it uniquely identifies every released build. Surfaced as semver build metadata:
# the jar and fabric.mod.json version become "<mod_version>+build.<build_number>".
build_number=2
maven_group=fm.gbti
