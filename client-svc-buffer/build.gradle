plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = 'client-svc-buffer'
}

repositories {
}

dependencies {
	// Unobfuscated MC 26.2: Loom provides the minecraft jar in official Mojang
	// names. There is deliberately NO `mappings ...` line, so Loom registers no
	// remapJar task and the plain `jar` output is the shippable artifact.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Simple Voice Chat is NOT a compile dependency: the mixin targets
	// ALSpeakerBase by its fully-qualified STRING name, so SVC is not needed on
	// the compile classpath. MixinExtras (@ModifyReturnValue) ships transitively
	// with fabric-loader 0.19.3.
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

// On unobfuscated 26.x there is no remapJar task (no mappings), so fall back to
// jar. The plain `jar` output IS the shippable mod artifact.
def outputJarTaskName = tasks.findByName('remapJar') != null ? 'remapJar' : 'jar'
