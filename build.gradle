plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Full version = semver + build metadata, e.g. 0.1.0+build.5. Build metadata has no semver
// precedence (an update check compares 0.1.0 vs 0.1.1, not the build), so each release still
// bumps patch/minor/major; the build number only makes every built jar individually traceable.
// build_number defaults to 0 for a plain dev build; `npm run release` bumps it.
version = "${project.mod_version}+build.${project.build_number}"
group = project.maven_group

base {
	archivesName = 'jockey-radio'
}

repositories {
	// Simple Voice Chat API (compileOnly integration for later phases)
	maven {
		name = 'MaxHenkel'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	// Concentus (pure-Java Opus encoder) for our own high-bitrate radio encoder.
	maven {
		name = 'JitPack'
		url = 'https://jitpack.io'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'

	// Pure-Java Opus encoder we control, so OUR radio channels can encode at a
	// music-grade bitrate SVC's api.createEncoder(AUDIO) cannot set. Pinned to a
	// commit for reproducibility (TSRBerry fork adds the root pom JitPack needs;
	// the module jar is clean org/concentus/* with zero transitive deps).
	// 'implementation' = compile classpath; 'include' = Loom jar-in-jar bundle so
	// the classes are on the mod classpath at runtime on a real server.
	implementation 'com.github.TSRBerry.concentus:Concentus:2115243f00'
	include        'com.github.TSRBerry.concentus:Concentus:2115243f00'

	// Unit tests. Only classes with no Minecraft dependency are tested (e.g. YtDlpResolve),
	// so the suite runs fast and offline without booting the game.
	testImplementation platform('org.junit:junit-bom:5.11.3')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}

	// Bundle the platform binaries INTO the jar so a Modrinth drop-in works with no shell and
	// no manual upload (see BundledBinaries). They live in .product/ (gitignored, ~500 MB for the
	// linux-amd64 and windows-amd64 sets), so they are copied at build time rather than committed.
	// If absent, a THIN jar is built - the mod still runs and falls back to a configured/PATH
	// ffmpeg. Keep the jar-resource names in sync with BundledBinaries.Platform.
	def productDir = file("${rootDir}/.product")
	def bundledFfmpeg = file("${productDir}/ffmpeg-linux-amd64-lgpl")
	def bundledYtdlp = file("${productDir}/yt-dlp-linux")
	def bundledDeno = file("${productDir}/deno")
	def bundledNotice = file("${productDir}/THIRD-PARTY-NOTICES.txt")
	def bundledLicenses = file("${productDir}/licenses")
	// Windows/amd64 set (ffmpeg.exe, yt-dlp.exe, deno.exe), bundled alongside when present.
	def winFfmpeg = file("${productDir}/ffmpeg-windows-amd64-lgpl.exe")
	def winYtdlp = file("${productDir}/yt-dlp-windows.exe")
	def winDeno = file("${productDir}/deno-windows.exe")
	// Declare the optional product tree via inputs.files (NOT inputs.dir): inputs.files tolerates a
	// missing path, so CI - which has no .product/ - validates and takes the thin-jar branch below,
	// whereas inputs.dir would fail validation on the absent directory before the fallback runs.
	inputs.files(bundledFfmpeg, bundledYtdlp, bundledDeno, winFfmpeg, winYtdlp, winDeno, bundledNotice, bundledLicenses)
	if (bundledFfmpeg.exists() && bundledYtdlp.exists()) {
		into('jockey_radio/bin/linux-amd64') {
			from(bundledFfmpeg) { rename { 'ffmpeg' } }
			from(bundledYtdlp) { rename { 'yt-dlp' } }
			// deno is the JS runtime yt-dlp needs for YouTube; optional (thin bundle omits it).
			if (bundledDeno.exists()) {
				from(bundledDeno) { rename { 'deno' } }
			}
		}
		if (winFfmpeg.exists() && winYtdlp.exists()) {
			into('jockey_radio/bin/windows-amd64') {
				from(winFfmpeg) { rename { 'ffmpeg.exe' } }
				from(winYtdlp) { rename { 'yt-dlp.exe' } }
				if (winDeno.exists()) {
					from(winDeno) { rename { 'deno.exe' } }
				}
			}
		}
		if (bundledNotice.exists()) {
			into('jockey_radio') { from(bundledNotice) }
		}
		// Full license texts for the bundled binaries + Concentus (LGPL/GPL/MIT/Unlicense/BSD).
		if (bundledLicenses.exists()) {
			into('jockey_radio/licenses') { from(bundledLicenses) }
		}
		doLast {
			logger.lifecycle('processResources: BUNDLED ffmpeg + yt-dlp' +
					(bundledDeno.exists() ? ' + deno' : '') + ' (linux-amd64)' +
					(winFfmpeg.exists() && winYtdlp.exists() ? ' and windows-amd64' : '') + ' into the jar.')
		}
	} else {
		doLast {
			logger.warn('processResources: .product/ binaries not found - building a THIN jar ' +
					'(no bundled ffmpeg/yt-dlp; the mod will fall back to a configured/PATH binary).')
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
}

// Tests run from build/ so the logger's logs/ folder never lands in the repository root.
tasks.withType(Test).configureEach {
	workingDir = layout.buildDirectory.dir('test-work').get().asFile
	doFirst { workingDir.mkdirs() }
}

// Fast, offline unit tests. The live connector checks are tagged "connector" and excluded here
// so a normal build never depends on the network or on yt-dlp being installed.
tasks.named('test', Test) {
	useJUnitPlatform {
		excludeTags 'connector', 'ffmpeg'
	}
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

// Platform-connector integrity check (sow-007/sow-013). Runs the REAL yt-dlp against one known URL
// per platform and asserts it still resolves to a format ffmpeg can demux. This is what detects
// "a platform changed its framework" - it is EXPECTED to break over time, which is why it is opt-in and
// never part of `build`.
//
//   ./gradlew connectorCheck                       # uses yt-dlp from PATH
//   ./gradlew connectorCheck -Pytdlp=/path/to/yt-dlp
tasks.register('connectorCheck', Test) {
	group = 'jockey'
	description = 'Live check that every platform connector still resolves (network + yt-dlp required).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'connector'
	}
	systemProperty 'jockey.connector.enabled', 'true'
	systemProperty 'jockey.ytdlp', (project.findProperty('ytdlp') ?: 'yt-dlp').toString()
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed', 'skipped'
		showStandardStreams = true
		exceptionFormat = 'full'
	}
}

// Live feed checks against a real ffmpeg (RTMP stream-key enforcement). Opt-in: needs an ffmpeg
// with lavfi, and binds loopback ports.
//
//   ./gradlew ffmpegCheck                          # uses ffmpeg from PATH
//   ./gradlew ffmpegCheck -Pffmpeg=/path/to/ffmpeg
tasks.register('ffmpegCheck', Test) {
	group = 'jockey'
	description = 'Live feed checks against a real ffmpeg (loopback only).'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ffmpeg'
	}
	systemProperty 'jockey.ffmpeg.enabled', 'true'
	systemProperty 'jockey.ffmpeg', (project.findProperty('ffmpeg') ?: 'ffmpeg').toString()
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

jar {
	from('LICENSE') {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Deploys the freshly built mod jar into the local dev server's mods folder.
// On unobfuscated 26.x there is no remapJar task (no mappings), so fall back to jar.
def outputJarTaskName = tasks.findByName('remapJar') != null ? 'remapJar' : 'jar'

tasks.register('deployMod') {
	dependsOn tasks.named(outputJarTaskName)
	group = 'jockey'
	description = 'Builds the mod and copies the finished jar into .server/mods, replacing any older copies.'

	def serverModsDir = file('.server/mods')

	doLast {
		def builtJar = tasks.named(outputJarTaskName).get().archiveFile.get().asFile

		serverModsDir.mkdirs()

		// Remove any previously deployed Jockey Radio jars.
		serverModsDir.listFiles()?.each { f ->
			def n = f.name
			if (n.matches('jockey[-_]radio.*\\.jar') || n.matches('savepoint.*-?radio.*\\.jar') || n.matches('travelers[-_]jukebox.*\\.jar')) {
				println "deployMod: deleting old ${f.name}"
				f.delete()
			}
		}

		copy {
			from builtJar
			into serverModsDir
		}
		println "deployMod: deployed ${builtJar.name} -> ${serverModsDir}"
	}
}
